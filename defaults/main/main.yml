---
# Any
named_service: "named"
named_pri_domain_name: "example.com"
named_self_log: true
named_log_level: "info"
named_package: bind9
named_forwarders:
  - 8.8.8.8
  - 8.8.4.4
# Config dirs
named_conf_dir: "/etc/bind"
named_work_dir: "/var/lib/bind"
named_cache_dir: "/var/cache/bind"
named_zones_dir: "{{ named_work_dir }}/zones"
named_log_dir: "{{ named_work_dir }}/log"
# Config files
named_conf: "{{ named_conf_dir }}/named.conf"
named_log: "{{ named_log_dir }}/named.log"
# SOA
named_all_zone_hostmaster: "hostmaster.{{ named_pri_domain_name }}"
named_all_zone_ttl: "3600"
named_all_zone_refresh: "3600"
named_all_zone_retry: "600"
named_all_zone_expire: "1209600"
named_all_zone_neg_ttl: "600"
