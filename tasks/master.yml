---
- name: MASTER | Check ensure {{ item }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: bind
    mode: '0755'
  loop:
    - "{{ bind_zones_dir }}"
    - "{{ bind_zones_dir }}/forward"
    - "{{ bind_zones_dir }}/reverse"

- name: MASTER | Setting up the options file
  ansible.builtin.template:
    src: "master/named.conf.options.j2"
    dest: "{{ bind_conf }}.options"
    owner: root
    group: root
    mode: "0644"
  notify: Restart BIND

- name: MASTER | Setting up a zone file
  ansible.builtin.template:
    src: "master/named.conf.local.j2"
    dest: "{{ bind_conf }}.local"
    owner: root
    group: root
    mode: "0644"
  notify: Restart BIND

- name: MASTER | Creating forward zones
  ansible.builtin.template:
    src: "master/forward_zone.j2"
    dest: "{{ bind_zones_dir }}/forward/db.{{ item.zone }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ bind_forward_zones }}"
  notify: Restart BIND

- name: MASTER | Creating reverse zones
  ansible.builtin.template:
    src: "master/reverse_zone.j2"
    dest: "{{ bind_zones_dir }}/reverse/db.{%
              if   (item.zone.split('.') | length) == 3 %}{{ (item.zone |
                  ansible.utils.ipaddr('revdns')).split('.')[1:] | join('.') }}{%
              elif (item.zone.split('.') | length) == 2 %}{{ (item.zone |
                  ansible.utils.ipaddr('revdns')).split('.')[2:] | join('.') }}{%
              elif (item.zone.split('.') | length) == 1 %}{{ (item.zone |
                  ansible.utils.ipaddr('revdns')).split('.')[2:] | join('.') }}{%
              endif %}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ bind_reverse_zones }}"
  notify: Restart BIND
