---
- name: named-slave | Setting up the options file
  ansible.builtin.template:
    src: "slave/named.conf.options.j2"
    dest: "{{ named_conf }}.options"
    owner: root
    group: root
    mode: "0644"
  notify:
    - CHECK CONFIGURATION NAMED
    - RECONFIGURATION NAMED
    - RELOAD NAMED
    - RESTART NAMED

- name: named-slave | Setting up a zone file
  ansible.builtin.template:
    src: "slave/named.conf.local.j2"
    dest: "{{ named_conf }}.local"
    owner: root
    group: root
    mode: "0644"
  notify:
    - CHECK CONFIGURATION NAMED
    - RECONFIGURATION NAMED
    - RELOAD NAMED
    - RESTART NAMED
